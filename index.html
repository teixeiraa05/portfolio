<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" />
    <meta
      name="description"
      content="Rodrigo Teixeira, Informatics and Computing Engineering student at FEUP. Projects, experience and contact information."
    />
    <title>Rodrigo Teixeira — Portfolio</title>
    <script>
      let theme
      try {
        theme = localStorage.getItem('portfolio-theme')
      } catch {
        // Storage may be disabled.
      }
      document.documentElement.dataset.theme =
        theme === 'light' || theme === 'dark'
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="root">
      <div class="grid min-h-dvh place-items-center px-4">
        <div
          class="flex w-full max-w-84 items-center gap-4 rounded-lg border border-[#3a4547] bg-[#202526] px-4 py-3 shadow-lg"
          role="status"
        >
          <img
            class="block size-9 shrink-0"
            src="/favicon.svg"
            alt=""
            width="36"
            height="36"
          />
          <div class="min-w-0 flex-1">
            <p class="mb-2 font-mono text-xs text-[#e3e9e6]">
              <span class="text-[#95d2ac]" aria-hidden="true">&gt;</span>
              Loading portfolio
            </p>
            <div class="terminal-loading-track" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <style>
        #root {
          display: none;
        }
      </style>
      <p class="page-shell py-8">Enable JavaScript to view the portfolio.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
