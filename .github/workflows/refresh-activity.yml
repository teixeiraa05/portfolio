name: Refresh contribution activity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contribution-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.DIRECTUS_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch activity
        run: npm run activity:refresh
        env:
          ACTIVITY_GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_UP_TOKEN }}
          ACTIVITY_GITLAB_TOKEN: ${{ secrets.ACTIVITY_GITLAB_UP_TOKEN }}
          GITLAB_PROFILE_URL: ${{ vars.GITLAB_UP_PROFILE_URL }}
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_WRITE_TOKEN: ${{ secrets.DIRECTUS_WRITE_TOKEN }}
