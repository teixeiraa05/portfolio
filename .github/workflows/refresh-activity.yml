name: Refresh contribution activity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: contribution-activity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch activity
        id: activity
        run: npm run activity:refresh
        env:
          ACTIVITY_GITHUB_TOKEN: ${{ secrets.ACTIVITY_GITHUB_UP_TOKEN }}
          ACTIVITY_GITLAB_TOKEN: ${{ secrets.ACTIVITY_GITLAB_UP_TOKEN }}
          GITLAB_PROFILE_URL: ${{ vars.GITLAB_UP_PROFILE_URL }}
      - name: Publish refreshed snapshot
        if: ${{ !cancelled() && steps.activity.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- src/data/activity.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/activity.json
          git commit -m 'chore: refresh contribution activity'
          git pull --rebase origin main
          git push origin HEAD:main
